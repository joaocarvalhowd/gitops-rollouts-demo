apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-normal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-normal
  template:
    metadata:
      labels:
        app: demo-normal
    spec:
      containers:
        - name: http-echo
          image: hashicorp/http-echo:1.0
          args:
            - -listen=:5678
            - -text=demo-normal v1        # ← bump this string for the rolling update
          ports:
            - containerPort: 5678
          resources:
            requests:
              cpu: 5m
              memory: 16Mi