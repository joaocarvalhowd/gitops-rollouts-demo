apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-normal
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/joaocarvalhowd/gitops-rollouts-demo.git
    targetRevision: main
    path: manifests/normal
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true